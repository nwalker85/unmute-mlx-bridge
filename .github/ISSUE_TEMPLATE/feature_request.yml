name: Feature request
description: Propose a change to unmute-mlx-bridge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Scope note: this project is deliberately **only** the two model
        servers. Anything requiring changes to Unmute itself, or downstream
        agent/orchestration features, is out of scope by design — see the
        design spec's non-goals.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the bridge doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require modifying Kyutai Unmute itself
        - label: >
            If this changes wire-protocol behavior, I've checked it against
            PROTOCOL.md and upstream moshi-server
