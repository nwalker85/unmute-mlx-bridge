---
name: ci

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_hardware:
        description: Run real-model tests on an Apple Silicon runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  python:
    name: Portable tests
    runs-on: ubuntu-latest
    # Bounds a hung test (e.g. a receive loop with no client-side timeout
    # waiting on a fix that was reverted) to a finite CI run instead of a
    # queued job that never completes (RAV-1552 S3).
    timeout-minutes: 15
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up uv
        # astral-sh/setup-uv v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"

      - name: Whitespace check
        run: git diff --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Run portable tests
        run: uv run --locked pytest -q
        # Hardware tests (pytest -m hardware) are NOT run here.
        # They require Apple Silicon and real model weights.
        # Run them explicitly on the reference host only.

  hardware:
    name: Apple Silicon hardware proof
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hardware }}
    # Real MLX inference, real Kyutai weights, real Apple Silicon (RAV-1613).
    # macos-14 is an Apple Silicon (M1) GitHub-hosted runner -- see
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md.
    # This job is intentionally manual: it downloads real model weights and
    # must never be triggered by untrusted pull-request code.
    runs-on: macos-14
    timeout-minutes: 45
    continue-on-error: false
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up uv
        # astral-sh/setup-uv v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"

      - name: Cache Hugging Face model weights
        # actions/cache v6.1.0. Keyed on config.py, which is where this
        # repo's model revision constants (STT_HF_REPO/TTS_HF_REPO/
        # TTS_VOICE_REPO defaults) live -- a change to any of them
        # invalidates the cache instead of silently reusing stale weights.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface
          key: >-
            hardware-hf-cache-${{
            hashFiles('src/unmute_mlx_bridge/config.py') }}
          restore-keys: |
            hardware-hf-cache-

      - name: Install dependencies
        run: uv sync --locked

      - name: Run hardware tests
        # -s so real_time_factor/rms/etc. print output is visible in the log
        # (see tests/hardware/test_{stt,tts}_hardware.py).
        run: uv run --locked pytest -m hardware -q -s
        # First uncached run downloads real Kyutai weights (a few GB) from
        # Hugging Face -- see README.md's "Hardware CI" note.
