---
name: ci

# DORMANT: GitHub is a private passive mirror while Forgejo is canonical.
# Re-enable automatic triggers only after explicit publication approval.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: norns-unmute-mlx-bridge
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up uv
        # astral-sh/setup-uv v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"

      - name: Whitespace check
        run: git diff --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Run portable tests
        run: uv run --locked pytest -q
        # Hardware tests (pytest -m hardware) are NOT run here.
        # They require Apple Silicon and real model weights.
        # Run them explicitly on the reference host only.
